<!-- Crea 4 divs que tengan alto y ancho de 200px y de colores azul, rojo, verde y
amarillo (insertar estilos con atributo style). Cada uno de los divs debe tener
un identificador único -->

<!-- Dentro del script agrega el evento para que al hacer click a cada uno de los
divs, este cambie de color al color negro. Utiliza addEventListener para
agregar el evento -->



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colores.</title>
</head>
<body>
    
    <div  id="azul" style=" height: 200 ; width: 200; color: blue ; border:solid 2px;padding: 20px ;margin: 10px"> azul </div>

    <div id="rojo" style=" height: 200 ; width: 200; color: red;border:solid 2px ;padding: 20px ;margin: 10px "> rojo </div>

    <div id="verde" style=" height: 200 ; width: 200; color: green;border:solid 2px ;padding: 20px ;margin: 10px"> verde </div>

    <div id="amarillo" style=" height: 200 ; width: 200; color: yellow;border:solid 2px ;padding: 20px ;margin: 10px"> amarillo </div>


    <script src="./assets/js/04_colores.js"></script>
</body>
</html>
